spring.application.name=backend-cafedronel
server.port=${PORT:8081}

# Valores sensibles solo por variables de entorno (ver application-example.properties).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario_backenddatabase}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

app.jwt.secret=${JWT_SECRET:CafedronelDevJwtSecret2026Minimo32Bytes!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
